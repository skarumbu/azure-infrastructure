name: Deploy Azure Infrastructure

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL

      - name: Read current Momentum Finder image
        id: mf_image
        run: |
          IMAGE=$(az containerapp show \
            --name momentum-finder-prod \
            --resource-group my-website-prod-rg \
            --query "properties.template.containers[0].image" \
            --output tsv 2>/dev/null || echo "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Read current Trail Finder image
        id: tf_image
        run: |
          IMAGE=$(az containerapp show \
            --name trail-finder-prod \
            --resource-group my-website-prod-rg \
            --query "properties.template.containers[0].image" \
            --output tsv 2>/dev/null || echo "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --name "infra-deploy-${{ github.sha }}" \
            --location centralus \
            --template-file main.bicep \
            --parameters \
              environment=prod \
              location=centralus \
              customDomain="www.quixotry.me" \
              momentumFinderImage="${{ steps.mf_image.outputs.image }}" \
              trailFinderImage="${{ steps.tf_image.outputs.image }}" \
              googlePlacesApiKey="${{ secrets.GOOGLE_PLACES_API_KEY }}" \
              googleSearchApiKey="${{ secrets.GOOGLE_SEARCH_API_KEY }}" \
              googleSearchEngineId="${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}" \
              azureTenantId="${{ secrets.AZURE_TENANT_ID }}" \
              azureClientId="${{ secrets.DASHBOARD_API_CLIENT_ID }}" \
              azureClientSecret="${{ secrets.DASHBOARD_API_CLIENT_SECRET }}" \
              ideasApiClientId="${{ secrets.IDEAS_API_CLIENT_ID }}" \
              ideasApiClientSecret="${{ secrets.IDEAS_API_CLIENT_SECRET }}" \
              ideasApiWriteKey="${{ secrets.IDEAS_API_WRITE_KEY }}" \
              githubPat="${{ secrets.BOT_GITHUB_PAT }}" \
              dashboardGithubToken="${{ secrets.DASHBOARD_GITHUB_TOKEN }}" \
              ideasBotImage="${{ secrets.IDEAS_BOT_IMAGE }}" \
              googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              postsApiClientId="${{ secrets.POSTS_API_CLIENT_ID }}" \
              postsApiClientSecret="${{ secrets.POSTS_API_CLIENT_SECRET }}" \
              githubToken="${{ secrets.POSTS_GITHUB_TOKEN }}" \
              corsOrigin="https://www.quixotry.me"

      - name: Deploy Codex Model (best-effort, quota-gated)
        continue-on-error: true
        run: |
          az deployment group create \
            --name "codex-model-deploy-${{ github.sha }}" \
            --resource-group my-website-prod-rg \
            --template-file modules/ideasbotcodexmodel.bicep

  update-arch-content:
    needs: deploy
    uses: skarumbu/my-website/.github/workflows/arch-content-update-reusable.yml@main
    with:
      repo_name: azure-infrastructure
      commit_sha: ${{ github.sha }}
      commit_message: ${{ github.event.head_commit.message }}
    secrets:
      ARCH_CONTENT_FOUNDRY_KEY: ${{ secrets.ARCH_CONTENT_FOUNDRY_KEY }}
      ARCH_UPDATE_GH_TOKEN: ${{ secrets.DESIGN_DOC_GH_TOKEN }}
